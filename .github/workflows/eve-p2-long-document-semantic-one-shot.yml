name: Eve P2 Long Document Semantic Context One Shot

on:
  push:
    branches:
      - feature/universal-evidence-ocr-foundation
    paths:
      - '.github/workflows/eve-p2-long-document-semantic-one-shot.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      LONG_DOCUMENT_ACCEPTANCE_DIR: /tmp/eve-long-document-semantic
      MIXED_PDF_OCR_ACCEPTANCE_DIR: /tmp/eve-mixed-pdf-ocr
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/universal-evidence-ocr-foundation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply bounded long-document semantic patch
        run: |
          python3 scripts/eve-p2-long-document-semantic-apply.py
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Install mixed-PDF regression dependencies
        run: python3 -m pip install --user --quiet 'Pillow==12.3.0' 'PyMuPDF==1.26.4'

      - name: Generate deterministic long-document PDF
        run: |
          rm -rf "$LONG_DOCUMENT_ACCEPTANCE_DIR"
          mkdir -p "$LONG_DOCUMENT_ACCEPTANCE_DIR"
          npx tsx server/tests/generateLongDocumentSemanticFixture.ts

      - name: Long-document source and semantic truth
        run: npx tsx server/tests/longDocumentSemanticContext.test.ts

      - name: Long-document runtime wiring
        run: npx tsx server/tests/longDocumentSemanticRuntimeWiring.test.ts

      - name: Long-document targeted Minerva acceptance
        run: npx tsx server/tests/longDocumentSemanticCurriculumAcceptance.test.ts

      - name: Existing semantic evidence and curriculum regressions
        run: |
          npx tsx server/tests/fiveDimensionAcademyCurriculum.test.ts
          npx tsx server/tests/fiveDimensionAcademyGrading.test.ts
          npx tsx server/tests/universalSourceEvidenceContract.test.ts
          npx tsx server/tests/taskEvidenceSufficiency.test.ts
          npx tsx server/tests/academyOcrCurriculumRunner.test.ts
          npx tsx server/tests/pdfOcrFallback.test.ts
          rm -rf "$MIXED_PDF_OCR_ACCEPTANCE_DIR"
          mkdir -p "$MIXED_PDF_OCR_ACCEPTANCE_DIR"
          python3 scripts/academy/generate_mixed_pdf_selective_fixture.py
          npx tsx server/tests/mixedPdfSelectiveOcr.test.ts
          npx tsx server/tests/mixedPdfSelectiveOcrFailClosed.test.ts

      - name: Production build
        run: npm run build

      - name: Upload long-document semantic acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: eve-long-document-semantic-context-acceptance
          path: /tmp/eve-long-document-semantic
          retention-days: 7

      - name: Final production build after acceptance gates
        run: npm run build

      - name: Commit tested long-document semantic closure and remove one-shot machinery
        run: |
          rm -f scripts/eve-p2-long-document-semantic-apply.py .github/workflows/eve-p2-long-document-semantic-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close long-document semantic context curriculum'
          git push origin HEAD:feature/universal-evidence-ocr-foundation
