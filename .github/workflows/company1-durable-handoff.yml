name: Company 1 durable queue and handoff repair

on:
  push:
    branches:
      - fix/company1-durable-handoff

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/company1-durable-handoff

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply corrected durable repair from audited patch script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          original = subprocess.check_output([
              'git','show','3335829cf1c79b6dd24c9431d74e1e10a3c731a1:.github/workflows/company1-durable-handoff.yml'
          ], text=True)
          marker = "          python3 - <<'PY'\n"
          start = original.index(marker) + len(marker)
          end = original.index("\n          PY", start)
          lines = original[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith('          ') else line for line in lines)
          script = script.replace(
              "  public performDiskSave(): Promise<void>;\\n",
              "  public async performDiskSave(): Promise<void>;\\n"
          )
          script = script.replace(
              "  public performDiskSave(allowIntakeCreation?: boolean): Promise<void>;\\n",
              "  public async performDiskSave(allowIntakeCreation?: boolean): Promise<void>;\\n"
          )
          script = script.replace(
              "  public performDiskSave(allowIntakeCreation = false): Promise<void> {\\n",
              "  public async performDiskSave(allowIntakeCreation = false): Promise<void> {\\n"
          )
          script = script.replace(
              "    return queuedWrite;\\n  }\\n\\n  private async performDiskSaveNow",
              "    return await queuedWrite;\\n  }\\n\\n  private async performDiskSaveNow"
          )
          Path('/tmp/company1_durable_repair.py').write_text(script)
          PY
          python3 /tmp/company1_durable_repair.py

          test -f server/tests/company1DurableHandoff.test.ts
          grep -q 'private diskSaveChain: Promise<void> = Promise.resolve()' server/backgroundQueue.ts
          grep -q 'public async performDiskSave(): Promise<void>' server/backgroundQueue.ts
          grep -q 'recoverPersistedJobsAfterAuthorityAcquired' server/backgroundQueue.ts
          grep -q 'evidenceStatus: f.evidenceStatus' server.ts
          grep -q 'verificationStatus: f.verificationStatus' server.ts
          grep -q 'company1DurableHandoff.test.ts' package.json
          echo DURABLE_PATCH_PRESENT=YES

      - name: Install dependencies
        run: npm ci

      - name: TypeScript lint
        run: npm run lint

      - name: Full regression suite
        run: npm test

      - name: Production build and hashes
        run: |
          npm run build
          sha256sum dist/server.cjs dist/worker.cjs

      - name: Commit validated repair and remove one-shot workflows
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f --ignore-unmatch .github/workflows/company1-durable-handoff.yml .github/workflows/company1-durable-handoff-v2.yml
          git add -A
          git status --short
          git commit -m "fix(company1): make queue persistence and proof handoff durable"
          git push origin HEAD:fix/company1-durable-handoff
