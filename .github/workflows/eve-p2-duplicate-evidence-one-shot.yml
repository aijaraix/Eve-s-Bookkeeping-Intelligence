name: Eve P2 Duplicate Evidence One Shot

on:
  push:
    branches:
      - feature/universal-evidence-ocr-foundation
    paths:
      - '.github/workflows/eve-p2-duplicate-evidence-one-shot.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      DUPLICATE_EVIDENCE_ACCEPTANCE_DIR: /tmp/eve-duplicate-evidence
      EVE_TEST_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/universal-evidence-ocr-foundation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply bounded duplicate-evidence patch
        run: |
          python3 scripts/eve-p2-duplicate-evidence-apply.py
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Install deterministic image fixture dependency
        run: python3 -m pip install --user --quiet 'Pillow==12.3.0'

      - name: Generate physical duplicate and near-duplicate source families
        run: |
          rm -rf "$DUPLICATE_EVIDENCE_ACCEPTANCE_DIR"
          mkdir -p "$DUPLICATE_EVIDENCE_ACCEPTANCE_DIR"
          python3 scripts/academy/generate_ocr_curriculum_fixtures.py "$DUPLICATE_EVIDENCE_ACCEPTANCE_DIR" >/tmp/eve-dup-base.txt
          python3 scripts/academy/generate_duplicate_evidence_images.py "$DUPLICATE_EVIDENCE_ACCEPTANCE_DIR"
          npx tsx server/tests/generateDuplicateEvidenceFixtures.ts

      - name: Duplicate evidence source semantic and accounting truth
        run: npx tsx server/tests/duplicateEvidenceIntegrityEngine.test.ts

      - name: Duplicate evidence Deliverable Truth
        run: npx tsx server/tests/duplicateEvidenceDeliverableTruth.test.ts

      - name: Existing Academy and evidence contract regressions
        run: |
          npx tsx server/tests/fiveDimensionAcademyCurriculum.test.ts
          npx tsx server/tests/fiveDimensionAcademyGrading.test.ts
          npx tsx server/tests/universalSourceEvidenceContract.test.ts
          npx tsx server/tests/taskEvidenceSufficiency.test.ts
          npx tsx server/tests/sufficiencyClarificationCoordinator.test.ts
          timeout 30s npx tsx server/tests/sufficiencyClarificationRoutes.test.ts
          npx tsx server/tests/ocrParserEvidence.test.ts
          npx tsx server/tests/ocrFailClosedQualityGate.test.ts
          npx tsx server/tests/pdfOcrFallback.test.ts

      - name: Existing deliverable regressions
        run: |
          export BANK_STATEMENT_ACCEPTANCE_EVIDENCE_DIR=/tmp/eve-bank-duplicate-regression
          rm -rf "$BANK_STATEMENT_ACCEPTANCE_EVIDENCE_DIR"
          npx tsx server/tests/generateBankStatementCurriculumFixtures.ts
          npx tsx server/tests/bankStatementDeliverableTruth.test.ts
          export TRIAL_BALANCE_ACCEPTANCE_EVIDENCE_DIR=/tmp/eve-tb-duplicate-regression
          rm -rf "$TRIAL_BALANCE_ACCEPTANCE_EVIDENCE_DIR"
          npx tsx server/tests/generateTrialBalanceCurriculumFixtures.ts
          npx tsx server/tests/trialBalanceDeliverableTruth.test.ts
          npx tsx server/tests/invoiceApDeliverableTruth.test.ts

      - name: Production build
        run: npm run build

      - name: Duplicate evidence Product Truth in actual built Eve UI
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then echo 'MISSING_BROWSER_EXECUTABLE'; exit 1; fi
          export CHROME_BIN
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/eve-duplicate-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          npx tsx server/tests/duplicateEvidenceProductTruthBrowser.test.ts
          kill $PREVIEW_PID 2>/dev/null || true
          wait $PREVIEW_PID 2>/dev/null || true
          trap - EXIT

      - name: Compose evidence-backed five-dimension result
        run: npx tsx server/tests/duplicateEvidenceFiveDimensionAcceptance.test.ts

      - name: Upload duplicate evidence acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: eve-duplicate-evidence-five-dimension-acceptance
          path: /tmp/eve-duplicate-evidence
          retention-days: 7

      - name: Final production build after acceptance gates
        run: npm run build

      - name: Commit tested duplicate-evidence closure and remove one-shot machinery
        run: |
          rm -f scripts/eve-p2-duplicate-evidence-apply.py .github/workflows/eve-p2-duplicate-evidence-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close duplicate near-duplicate evidence curriculum'
          git push origin HEAD:feature/universal-evidence-ocr-foundation
