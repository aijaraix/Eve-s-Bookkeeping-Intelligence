name: Eve P2 Mixed Source Batch Rerun 2

on:
  push:
    branches:
      - feature/universal-evidence-ocr-foundation
    paths:
      - '.github/workflows/eve-p2-mixed-source-batch-rerun2.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      MIXED_SOURCE_BATCH_ACCEPTANCE_EVIDENCE_DIR: /tmp/eve-mixed-source-batch
      RECEIPT_ACCEPTANCE_EVIDENCE_DIR: /tmp/eve-mixed-source-batch
      EVE_TEST_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/universal-evidence-ocr-foundation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Run full mixed-source batch acceptance
        run: bash scripts/eve-p2-mixed-source-batch-run.sh
      - name: Upload mixed-source batch acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: eve-mixed-source-batch-five-dimension-acceptance
          path: /tmp/eve-mixed-source-batch
          retention-days: 7
      - name: Final production build after acceptance gates
        run: npm run build
      - name: Commit tested mixed-source batch closure and remove one-shot machinery
        run: |
          rm -f scripts/eve-p2-mixed-source-batch-apply.py scripts/eve-p2-mixed-source-batch-fix1.py scripts/eve-p2-mixed-source-batch-fix2.py scripts/eve-p2-mixed-source-batch-run.sh
          rm -f .github/workflows/eve-p2-mixed-source-batch-one-shot.yml .github/workflows/eve-p2-mixed-source-batch-rerun.yml .github/workflows/eve-p2-mixed-source-batch-rerun2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close mixed source batch curriculum'
          git push origin HEAD:feature/universal-evidence-ocr-foundation
