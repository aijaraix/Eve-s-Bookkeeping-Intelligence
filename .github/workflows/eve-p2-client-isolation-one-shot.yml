name: Eve P2 Bulk Client Isolation One Shot

on:
  push:
    branches:
      - feature/universal-evidence-ocr-foundation
    paths:
      - '.github/workflows/eve-p2-client-isolation-one-shot.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      CLIENT_ISOLATION_ACCEPTANCE_DIR: /tmp/eve-client-isolation
      EVE_TEST_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/universal-evidence-ocr-foundation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply bounded bulk-client isolation patch
        run: |
          python3 scripts/eve-p2-client-isolation-apply.py
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Generate physical collision-prone client fixtures
        run: npx tsx server/tests/generateClientIsolationFixtures.ts

      - name: Client isolation source semantic and accounting truth
        run: npx tsx server/tests/clientIsolationEngine.test.ts

      - name: Client isolation Deliverable Truth
        run: npx tsx server/tests/clientIsolationDeliverableTruth.test.ts

      - name: Existing isolation evidence and grading regressions
        run: |
          npx tsx server/tests/fiveDimensionAcademyCurriculum.test.ts
          npx tsx server/tests/fiveDimensionAcademyGrading.test.ts
          npx tsx server/tests/universalSourceEvidenceContract.test.ts
          npx tsx server/tests/ownerEngagementReadModel.test.ts
          npx tsx server/tests/phasePackageB4_3ClaimOriginFix.test.ts
          npx tsx server/tests/taskEvidenceSufficiency.test.ts
          npx tsx server/tests/sufficiencyClarificationCoordinator.test.ts

      - name: Production build
        run: npm run build

      - name: Client isolation Product Truth in actual built Eve UI
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then echo 'MISSING_BROWSER_EXECUTABLE'; exit 1; fi
          export CHROME_BIN
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/eve-client-isolation-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          npx tsx server/tests/clientIsolationProductTruthBrowser.test.ts
          kill $PREVIEW_PID 2>/dev/null || true
          wait $PREVIEW_PID 2>/dev/null || true
          trap - EXIT

      - name: Compose evidence-backed five-dimension result
        run: npx tsx server/tests/clientIsolationFiveDimensionAcceptance.test.ts

      - name: Upload client isolation acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: eve-bulk-client-isolation-five-dimension-acceptance
          path: /tmp/eve-client-isolation
          retention-days: 7

      - name: Final production build after acceptance gates
        run: npm run build

      - name: Commit tested bulk-client isolation closure and remove one-shot machinery
        run: |
          rm -f scripts/eve-p2-client-isolation-apply.py .github/workflows/eve-p2-client-isolation-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close bulk mixed-client isolation curriculum'
          git push origin HEAD:feature/universal-evidence-ocr-foundation
