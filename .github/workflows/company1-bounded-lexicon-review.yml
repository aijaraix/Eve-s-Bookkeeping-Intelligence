name: Company 1 bounded Lexicon and review package
on:
  push:
    branches: [fix/company1-bounded-lexicon-review-package]
    paths: ['.github/workflows/company1-bounded-lexicon-review.yml', '.github/scripts/apply_bounded_lexicon_review.py']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/company1-bounded-lexicon-review-package
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply narrow integration repair
        run: python3 .github/scripts/apply_bounded_lexicon_review.py
      - run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: Existing regressions
        run: npm test
      - name: Bounded execution and report behavior
        run: npx tsx server/tests/company1BoundedLexiconReview.test.ts
      - name: Production build
        run: |
          npm run build
          sha256sum dist/server.cjs dist/worker.cjs
      - name: Commit validated source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/apply_bounded_lexicon_review.py .github/workflows/company1-bounded-lexicon-review.yml
          git add server/cpaOrganization server/tests/company1VerifiedContinuation.test.ts
          git commit -m 'fix(company1): bounded Lexicon execution and period-faithful review package'
          git push origin HEAD:fix/company1-bounded-lexicon-review-package
