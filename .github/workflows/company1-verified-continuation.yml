name: Company 1 verified customer continuation

on:
  push:
    branches:
      - fix/company1-verified-continuation

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/company1-verified-continuation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize patch anchor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/cpaOrganization/hermesJobDispatchService.ts')
          s = p.read_text()
          old = "            provenanceStatus: actualSha256Match ? 'FULL_CRYPTOGRAPHIC_PROVENANCE_PROVED' : 'HASH_MISMATCH_FAIL'\n"
          new = "            provenanceStatus: actualSha256Match ? 'FULL_CRYPTOGRAPHIC_PROVENANCE_PROVED' : 'HASH_MISMATCH_FAIL' \n"
          if old not in s:
              raise SystemExit('Veritas normalization anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply verified continuation patch
        run: python3 .github/scripts/company1_verified_continuation.py
      - name: Complete specialist-role verified fact scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/cpaOrganization/hermesJobDispatchService.ts')
          s = p.read_text()
          old = "    const { params } = context;\n\n    switch (agentId) {"
          new = "    const { params } = context;\n    const verifiedFactCount = Array.isArray(params.verifiedFacts) ? params.verifiedFacts.length : 0;\n\n    switch (agentId) {"
          if old not in s:
              raise SystemExit('specialist-role scope anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Make positive Minerva fixtures proof-complete
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # H.9.44 positive live-engagement fixture: keep the real Acme HTML source and
          # explicitly model the proof state that the test claims is valid.
          p = Path('server/tests/phaseH944Conformance.test.ts')
          s = p.read_text()
          old = """  // Test 9: Minerva Live Engagement Validation checks accounting identities without forcing Unilever values\n  const liveVal = academyMinervaLab.evaluateLiveEngagement({\n    facts: nonPltrExtraction.atomicDataPoints,"""
          new = """  // Test 9: Minerva Live Engagement Validation checks accounting identities without forcing Unilever values.\n  // This is a positive fixture, so its facts must carry the same proof contract required in production.\n  const liveProofFacts = nonPltrExtraction.atomicDataPoints.map((fact: any) => ({\n    ...fact,\n    status: 'APPROVED',\n    verificationStatus: 'VERIFIED',\n    evidenceStatus: 'CONFIRMED',\n    documentId: fact.documentId || 'doc-acme-live',\n    sourceText: fact.sourceText || dummyNonPalantirFiling\n  }));\n  const liveVal = academyMinervaLab.evaluateLiveEngagement({\n    facts: liveProofFacts,"""
          if old not in s:
              raise SystemExit('H944 Minerva positive fixture anchor missing')
          p.write_text(s.replace(old, new, 1))

          # B4.2 positive fixture: use a real source file containing the claimed fact,
          # not an unrelated package.json hash, and carry proof-complete fact fields.
          p = Path('server/tests/phasePackageB4_2BehavioralVerification.test.ts')
          s = p.read_text()
          old = """  // 1. test_minerva_live_engagement_returns_technical_validation_passed_not_certified_cpa\n  const pkgBytes = fs.readFileSync('package.json');\n  const pkgHash = crypto.createHash('sha256').update(pkgBytes).digest('hex');\n  const liveResult = academyMinervaLab.evaluateLiveEngagement({\n    facts: [\n      {\n        id: 'fact-rev-1',\n        metric: 'Turnover',\n        value: 50503000000,\n        period: 'FY2025',\n        currency: 'EUR',\n        sourcePage: 98,\n        sourceDocumentId: 'unilever-2025-20f.pdf'\n      }\n    ],\n    assets: 100,\n    liabilities: 60,\n    equity: 40,\n    variance: 0,\n    physicalFilePath: 'package.json',\n    physicalSha256: pkgHash\n  });"""
          new = """  // 1. test_minerva_live_engagement_returns_technical_validation_passed_not_certified_cpa\n  const liveSourcePath = 'storage/cpa_memory/b42_live_source.txt';\n  const liveSourceText = 'Turnover 50503000000 EUR FY2025';\n  fs.mkdirSync('storage/cpa_memory', { recursive: true });\n  fs.writeFileSync(liveSourcePath, liveSourceText, 'utf8');\n  const pkgHash = crypto.createHash('sha256').update(fs.readFileSync(liveSourcePath)).digest('hex');\n  const liveResult = academyMinervaLab.evaluateLiveEngagement({\n    facts: [\n      {\n        id: 'fact-rev-1',\n        metric: 'Turnover',\n        value: 50503000000,\n        period: 'FY2025',\n        currency: 'EUR',\n        sourcePage: 1,\n        documentId: 'unilever-2025-20f.pdf',\n        sourceDocumentId: 'unilever-2025-20f.pdf',\n        sourceText: liveSourceText,\n        status: 'APPROVED',\n        verificationStatus: 'VERIFIED',\n        evidenceStatus: 'CONFIRMED'\n      }\n    ],\n    assets: 100,\n    liabilities: 60,\n    equity: 40,\n    variance: 0,\n    physicalFilePath: liveSourcePath,\n    physicalSha256: pkgHash\n  });\n  try { fs.unlinkSync(liveSourcePath); } catch (_) {}"""
          if old not in s:
              raise SystemExit('B4.2 Minerva positive fixture anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: TypeScript lint
        run: npm run lint
      - name: Full regression suite
        run: npm test
      - name: Production build and hashes
        run: |
          npm run build
          sha256sum dist/server.cjs dist/worker.cjs
      - name: Commit validated repair and remove one-shot helpers
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/company1-verified-continuation.yml .github/scripts/company1_verified_continuation.py
          git add -A
          git commit -m "feat(company1): continue verified customer work through CPA review"
          git push origin HEAD:fix/company1-verified-continuation
