name: Company 1 verified customer continuation

on:
  push:
    branches:
      - fix/company1-verified-continuation

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/company1-verified-continuation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize patch anchor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/cpaOrganization/hermesJobDispatchService.ts')
          s = p.read_text()
          old = "            provenanceStatus: actualSha256Match ? 'FULL_CRYPTOGRAPHIC_PROVENANCE_PROVED' : 'HASH_MISMATCH_FAIL'\n"
          new = "            provenanceStatus: actualSha256Match ? 'FULL_CRYPTOGRAPHIC_PROVENANCE_PROVED' : 'HASH_MISMATCH_FAIL' \n"
          if old not in s:
              raise SystemExit('Veritas normalization anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply verified continuation patch
        run: python3 .github/scripts/company1_verified_continuation.py
      - name: Complete specialist-role verified fact scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/cpaOrganization/hermesJobDispatchService.ts')
          s = p.read_text()
          old = "    const { params } = context;\n\n    switch (agentId) {"
          new = "    const { params } = context;\n    const verifiedFactCount = Array.isArray(params.verifiedFacts) ? params.verifiedFacts.length : 0;\n\n    switch (agentId) {"
          if old not in s:
              raise SystemExit('specialist-role scope anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: TypeScript lint
        run: npm run lint
      - name: Full regression suite
        run: npm test
      - name: Production build and hashes
        run: |
          npm run build
          sha256sum dist/server.cjs dist/worker.cjs
      - name: Commit validated repair and remove one-shot helpers
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/company1-verified-continuation.yml .github/scripts/company1_verified_continuation.py
          git add -A
          git commit -m "feat(company1): continue verified customer work through CPA review"
          git push origin HEAD:fix/company1-verified-continuation
