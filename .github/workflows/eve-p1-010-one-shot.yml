name: Eve P1-010 Clarification PBC One Shot

on:
  push:
    branches:
      - feature/universal-evidence-ocr-foundation
    paths:
      - '.github/workflows/eve-p1-010-one-shot.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/universal-evidence-ocr-foundation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply bounded P1-010 patch
        run: |
          python3 scripts/eve-p1-010-apply.py
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: P1-010 clarification coordinator contract
        run: npx tsx server/tests/sufficiencyClarificationCoordinator.test.ts

      - name: P1-010 clarification routes/auth
        run: timeout 30s npx tsx server/tests/sufficiencyClarificationRoutes.test.ts

      - name: P1-009 sufficiency regression
        run: npx tsx server/tests/taskEvidenceSufficiency.test.ts

      - name: Universal evidence regression
        run: npx tsx server/tests/universalSourceEvidenceContract.test.ts

      - name: Spreadsheet lineage regression
        run: npx tsx server/tests/spreadsheetSourceToPixelLineage.test.ts

      - name: OCR parser evidence regression
        run: npx tsx server/tests/ocrParserEvidence.test.ts

      - name: Presentation regression
        run: npx tsx src/adapters/presentationAdapters.test.ts

      - name: Production build
        run: npm run build

      - name: Commit tested P1-010 integration and remove one-shot machinery
        run: |
          rm -f scripts/eve-p1-010-apply.py .github/workflows/eve-p1-010-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Link clarification PBC lifecycle to task evidence sufficiency'
          git push origin HEAD:feature/universal-evidence-ocr-foundation
