name: Eve P2 Receipt Five Dimension One Shot

on:
  push:
    branches:
      - feature/universal-evidence-ocr-foundation
    paths:
      - '.github/workflows/eve-p2-receipt-five-dimension-one-shot.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      RECEIPT_ACCEPTANCE_EVIDENCE_DIR: /tmp/eve-receipt-five-dimension
      EVE_TEST_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/universal-evidence-ocr-foundation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply bounded receipt Product and Deliverable Truth patch
        run: |
          python3 scripts/eve-p2-receipt-product-deliverable-apply.py
          python3 scripts/eve-p2-receipt-product-deliverable-fix1.py
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Install deterministic fixture dependency
        run: python3 -m pip install --user --quiet 'Pillow==12.3.0'

      - name: Generate exact receipt and exact source pixel region
        run: |
          rm -rf "$RECEIPT_ACCEPTANCE_EVIDENCE_DIR"
          mkdir -p "$RECEIPT_ACCEPTANCE_EVIDENCE_DIR"
          python3 scripts/academy/generate_ocr_curriculum_fixtures.py "$RECEIPT_ACCEPTANCE_EVIDENCE_DIR" > "$RECEIPT_ACCEPTANCE_EVIDENCE_DIR/generation.txt"
          cat "$RECEIPT_ACCEPTANCE_EVIDENCE_DIR/generation.txt"
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import hashlib, json, os
          root=Path(os.environ['RECEIPT_ACCEPTANCE_EVIDENCE_DIR'])
          receipt=root/'receipt.png'
          payload=receipt.read_bytes()
          sha=hashlib.sha256(payload).hexdigest()
          assert sha == 'bdd93a72a51d82cc5df6c6a8989db023e9b45b1f18344e43054647851e173436'
          image=Image.open(receipt).convert('L')
          assert image.size == (900,1000)
          draw=ImageDraw.Draw(image)
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf',40)
          bbox=draw.textbbox((60,552),'TOTAL $53.23',font=font)
          assert bbox == (60,559,349,596), bbox
          x0,y0,x1,y1=bbox
          evidence={
            'marker':'RECEIPT_FIXTURE_SOURCE_REGION=PASS',
            'sourceSha256':sha,'filename':'receipt.png','imageWidth':900,'imageHeight':1000,
            'pixelBoundingBox':{'x':x0,'y':y0,'width':x1-x0,'height':y1-y0},
            'normalizedBoundingBox':{'x':x0/900,'y':y0/1000,'width':(x1-x0)/900,'height':(y1-y0)/1000,'unit':'NORMALIZED'},
            'rawLiteral':'TOTAL $53.23','transformId':'academy-fixture-glyph-bbox-v1'
          }
          (root/'source-region.json').write_text(json.dumps(evidence,indent=2))
          print('RECEIPT_FIXTURE_SOURCE_REGION=PASS',json.dumps(evidence['normalizedBoundingBox'],sort_keys=True))
          PY

      - name: Existing OCR curriculum runner default regression
        run: npx tsx server/tests/academyOcrCurriculumRunner.test.ts

      - name: Receipt deliverable reverse-lineage truth
        run: npx tsx server/tests/receiptDeliverableTruth.test.ts

      - name: Image source-to-pixel presentation regression
        run: npx tsx server/tests/imageSourceToPixelPresentation.test.ts

      - name: Five-dimension curriculum catalog regression
        run: npx tsx server/tests/fiveDimensionAcademyCurriculum.test.ts

      - name: Five-dimension grading regression
        run: npx tsx server/tests/fiveDimensionAcademyGrading.test.ts

      - name: OCR parser evidence regression
        run: npx tsx server/tests/ocrParserEvidence.test.ts

      - name: OCR orientation retry regression
        run: npx tsx server/tests/ocrOrientationRetry.test.ts

      - name: OCR fail-closed quality regression
        run: npx tsx server/tests/ocrFailClosedQualityGate.test.ts

      - name: PDF OCR fallback regression
        run: npx tsx server/tests/pdfOcrFallback.test.ts

      - name: P1-009 sufficiency regression
        run: npx tsx server/tests/taskEvidenceSufficiency.test.ts

      - name: P1-010 clarification coordinator regression
        run: npx tsx server/tests/sufficiencyClarificationCoordinator.test.ts

      - name: P1-010 clarification route/auth regression
        run: timeout 30s npx tsx server/tests/sufficiencyClarificationRoutes.test.ts

      - name: Universal evidence regression
        run: npx tsx server/tests/universalSourceEvidenceContract.test.ts

      - name: Spreadsheet lineage regression
        run: npx tsx server/tests/spreadsheetSourceToPixelLineage.test.ts

      - name: Presentation adapter regression
        run: npx tsx src/adapters/presentationAdapters.test.ts

      - name: Academy dashboard truth regression
        run: npx tsx server/tests/academyDashboardTruthAuditor.test.ts

      - name: Production build
        run: npm run build

      - name: Receipt Product Truth in actual built Eve UI
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then echo 'MISSING_BROWSER_EXECUTABLE'; exit 1; fi
          export CHROME_BIN
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/eve-receipt-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          npx tsx server/tests/receiptProductTruthBrowser.test.ts
          kill $PREVIEW_PID 2>/dev/null || true
          wait $PREVIEW_PID 2>/dev/null || true
          trap - EXIT

      - name: Compose evidence-backed five-dimension receipt result
        run: npx tsx server/tests/receiptFiveDimensionAcceptance.test.ts

      - name: Upload bounded receipt acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: eve-receipt-five-dimension-acceptance
          path: /tmp/eve-receipt-five-dimension
          retention-days: 7

      - name: Final production build after acceptance gates
        run: npm run build

      - name: Commit tested receipt five-dimension closure and remove one-shot machinery
        run: |
          rm -f scripts/eve-p2-receipt-product-deliverable-apply.py scripts/eve-p2-receipt-product-deliverable-fix1.py .github/workflows/eve-p2-receipt-five-dimension-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close receipt Product and Deliverable Truth'
          git push origin HEAD:feature/universal-evidence-ocr-foundation
