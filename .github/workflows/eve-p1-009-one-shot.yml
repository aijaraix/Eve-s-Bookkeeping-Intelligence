name: Eve P1-009 Task Evidence Sufficiency One Shot

on:
  push:
    branches:
      - feature/universal-evidence-ocr-foundation
    paths:
      - '.github/workflows/eve-p1-009-one-shot.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/universal-evidence-ocr-foundation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply bounded P1-009 patch
        run: |
          python3 scripts/eve-p1-009-apply.py
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Task evidence sufficiency contract
        run: npx tsx server/tests/taskEvidenceSufficiency.test.ts

      - name: Universal evidence contract regression
        run: npx tsx server/tests/universalSourceEvidenceContract.test.ts

      - name: Spreadsheet lineage regression
        run: npx tsx server/tests/spreadsheetSourceToPixelLineage.test.ts

      - name: Local OCR routing regression
        run: npx tsx server/tests/localOcrRouting.test.ts

      - name: OCR parser evidence regression
        run: npx tsx server/tests/ocrParserEvidence.test.ts

      - name: Image source-to-pixel presentation regression
        run: npx tsx server/tests/imageSourceToPixelPresentation.test.ts

      - name: Presentation adapter regression
        run: npx tsx src/adapters/presentationAdapters.test.ts

      - name: Production build
        run: npm run build

      - name: Commit tested P1-009 engine and remove one-shot machinery
        run: |
          rm -f scripts/eve-p1-009-apply.py .github/workflows/eve-p1-009-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement task evidence sufficiency decision engine'
          git push origin HEAD:feature/universal-evidence-ocr-foundation
