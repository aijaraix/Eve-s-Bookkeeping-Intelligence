name: Eve P2 Source to Dashboard Product Truth One Shot

on:
  push:
    branches:
      - feature/universal-evidence-ocr-foundation
    paths:
      - '.github/workflows/eve-p2-source-to-dashboard-one-shot.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      SOURCE_DASHBOARD_ACCEPTANCE_DIR: /tmp/eve-source-to-dashboard
      RECEIPT_ACCEPTANCE_EVIDENCE_DIR: /tmp/eve-source-to-dashboard
      EVE_TEST_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/universal-evidence-ocr-foundation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply bounded source-to-dashboard patch
        run: |
          python3 scripts/eve-p2-source-to-dashboard-apply.py
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Install deterministic receipt fixture dependency
        run: python3 -m pip install --user --quiet 'Pillow==12.3.0'

      - name: Generate physical spreadsheet and receipt sources
        run: |
          rm -rf "$SOURCE_DASHBOARD_ACCEPTANCE_DIR"
          mkdir -p "$SOURCE_DASHBOARD_ACCEPTANCE_DIR"
          python3 scripts/academy/generate_ocr_curriculum_fixtures.py "$SOURCE_DASHBOARD_ACCEPTANCE_DIR"
          npx tsx server/tests/generateSourceToDashboardFixtures.ts

      - name: Presentation lineage integrity including adversarial source swap
        run: npx tsx server/tests/sourceToDashboardPresentationIntegrity.test.ts

      - name: Existing source lineage and curriculum regressions
        run: |
          npx tsx server/tests/spreadsheetSourceToPixelLineage.test.ts
          npx tsx server/tests/universalSourceEvidenceContract.test.ts
          npx tsx server/tests/fiveDimensionAcademyCurriculum.test.ts
          npx tsx server/tests/fiveDimensionAcademyGrading.test.ts
          npx tsx server/tests/taskEvidenceSufficiency.test.ts

      - name: Production build
        run: npm run build

      - name: Product Truth in actual built Eve UI
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then echo 'MISSING_BROWSER_EXECUTABLE'; exit 1; fi
          export CHROME_BIN
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/eve-source-dashboard-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          npx tsx server/tests/sourceToDashboardProductTruthBrowser.test.ts
          kill $PREVIEW_PID 2>/dev/null || true
          wait $PREVIEW_PID 2>/dev/null || true
          trap - EXIT

      - name: Compose targeted Minerva acceptance
        run: npx tsx server/tests/sourceToDashboardCurriculumAcceptance.test.ts

      - name: Upload source-to-dashboard acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: eve-source-to-dashboard-product-truth-acceptance
          path: /tmp/eve-source-to-dashboard
          retention-days: 7

      - name: Final production build after acceptance gates
        run: npm run build

      - name: Commit tested Product Truth closure and remove one-shot machinery
        run: |
          rm -f scripts/eve-p2-source-to-dashboard-apply.py .github/workflows/eve-p2-source-to-dashboard-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close source-to-dashboard Product Truth curriculum'
          git push origin HEAD:feature/universal-evidence-ocr-foundation
