name: Third Studio export preservation and independent review
on:
  push:
    branches: [fix/frontend-runtime-parity]
    paths: [.github/workflows/studio-export-v3.yml]
permissions:
  contents: read
concurrency:
  group: studio-export-v3-review
  cancel-in-progress: false
jobs:
  preserve:
    if: github.ref == 'refs/heads/fix/frontend-runtime-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.save.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify branch is unchanged and preserve exact four-file export delta
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/fix/frontend-runtime-parity | cut -f1)" = "$EVENT_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "0509c73f68a1dfc722529d3e333993bbf137c489"
          python3 scripts/review/materialize_studio_export_v3.py
      - name: Commit to draft branch only and remove one-shot importer
        id: save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/cpaOrganization/cpaOrganizationRoutes.ts server/cpaOrganization/deliverableArtifactService.ts server/cpaOrganization/eveInternalAuditEngine.ts test_all_defects.ts
          git rm scripts/review/materialize_studio_export_v3.py .github/workflows/studio-export-v3.yml
          git commit -m 'wip(frontend): preserve third Studio export exactly; review before release'
          git push origin HEAD:refs/heads/fix/frontend-runtime-parity
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "PRESERVED_SOURCE_SHA=$(git rev-parse HEAD)"
  validate:
    needs: preserve
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      NODE_ENV: test
      ACADEMY_AUTONOMOUS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.preserve.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --include=dev
      - name: TypeScript checking
        id: types
        continue-on-error: true
        run: npm run lint
      - name: Existing regressions in isolated runner
        id: regressions
        continue-on-error: true
        run: |
          set +e
          timeout 180 npm test > "$RUNNER_TEMP/eve-v3-regressions.log" 2>&1
          result=$?
          tail -n 22 "$RUNNER_TEMP/eve-v3-regressions.log"
          echo "REGRESSION_EXIT=$result"
          exit "$result"
      - name: Repeat unchanged ten-check prior behavioral suite
        id: prior
        continue-on-error: true
        run: timeout 90 ./node_modules/.bin/tsx scripts/review/studioSecondExportBehavioralReview.ts
      - name: Test approval-event custody and disk report-version rehydration
        id: custody
        continue-on-error: true
        run: timeout 90 ./node_modules/.bin/tsx scripts/review/studioThirdExportBehavioralReview.ts
      - name: Production bundle generation is not production acceptance
        id: build
        continue-on-error: true
        env:
          NODE_ENV: production
        run: |
          npm run build
          sha256sum dist/server.cjs dist/worker.cjs
      - name: Save isolated evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: third-studio-export-review-evidence
          path: |
            studio-second-export-review-results.json
            studio-third-export-review-results.json
            ${{ runner.temp }}/eve-v3-regressions.log
          retention-days: 7
      - name: Truthful combined gate
        if: always()
        env:
          TYPES: ${{ steps.types.outcome }}
          REGRESSIONS: ${{ steps.regressions.outcome }}
          PRIOR: ${{ steps.prior.outcome }}
          CUSTODY: ${{ steps.custody.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          echo "TYPESCRIPT=$TYPES REGRESSIONS=$REGRESSIONS PRIOR_TEN_CHECKS=$PRIOR CUSTODY_AND_REHYDRATION=$CUSTODY BUILD=$BUILD"
          echo 'BROWSER_ACCEPTANCE=NOT_EXECUTED; PRODUCTION_ACCESS=NONE; DEPLOYMENT=NOT_REQUESTED'
          test "$TYPES" = success && test "$REGRESSIONS" = success && test "$PRIOR" = success && test "$CUSTODY" = success && test "$BUILD" = success
