name: Second Studio export preservation and independent review
on:
  push:
    branches: [fix/frontend-runtime-parity]
    paths: [.github/workflows/studio-export-v2.yml]
permissions:
  contents: read
concurrency:
  group: eve-studio-export-v2-preservation
  cancel-in-progress: false
jobs:
  preserve:
    if: github.repository == 'aijaraix/Eve-s-Bookkeeping-Intelligence' && github.ref == 'refs/heads/fix/frontend-runtime-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.commit.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify original baseline blobs and exact exported result bytes
        run: python3 scripts/review/materialize_studio_export_v2.py
      - name: Save to existing draft branch only; remove one-shot importer
        id: commit
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "0509c73f68a1dfc722529d3e333993bbf137c489"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts server/cpaOrganization/deliverableArtifactService.ts server/cpaOrganization/eveInternalAuditEngine.ts server/cpaOrganization/universalEngagementModel.ts server/cpaOrganization/verifiedCustomerContinuationService.ts src/components/views/engagement/DeliverablesView.tsx
          git rm scripts/review/materialize_studio_export_v2.py .github/workflows/studio-export-v2.yml
          git commit -m 'wip(frontend): preserve exact second Studio export; independent acceptance pending'
          git push origin HEAD:refs/heads/fix/frontend-runtime-parity
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "PRESERVED_SOURCE_SHA=$(git rev-parse HEAD)"
  validate:
    needs: preserve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NODE_ENV: test
      ACADEMY_AUTONOMOUS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preserve.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --include=dev
      - name: TypeScript validation
        id: types
        continue-on-error: true
        run: npm run lint
      - name: Existing isolated regression command
        id: regressions
        continue-on-error: true
        run: |
          set +e
          timeout 180 npm test > "$RUNNER_TEMP/eve-v2-regressions.log" 2>&1
          result=$?
          tail -n 20 "$RUNNER_TEMP/eve-v2-regressions.log"
          echo "REGRESSION_EXIT=$result"
          exit "$result"
      - name: Independent approval and version propagation probes
        id: probes
        continue-on-error: true
        run: timeout 90 ./node_modules/.bin/tsx scripts/review/studioSecondExportBehavioralReview.ts
      - name: Production bundle generation; not production acceptance
        id: bundle
        continue-on-error: true
        env:
          NODE_ENV: production
        run: |
          npm run build
          sha256sum dist/server.cjs dist/worker.cjs
      - name: Save isolated review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: second-studio-export-review-evidence
          path: |
            studio-second-export-review-results.json
            ${{ runner.temp }}/eve-v2-regressions.log
          if-no-files-found: warn
          retention-days: 7
      - name: Truthful combined gate
        if: always()
        env:
          TYPES: ${{ steps.types.outcome }}
          REGRESSIONS: ${{ steps.regressions.outcome }}
          PROBES: ${{ steps.probes.outcome }}
          BUNDLE: ${{ steps.bundle.outcome }}
        run: |
          echo "TYPESCRIPT=$TYPES"
          echo "REGRESSIONS=$REGRESSIONS"
          echo "INDEPENDENT_BOUNDARY_TESTS=$PROBES"
          echo "BUNDLE=$BUNDLE"
          echo 'BROWSER_ACCEPTANCE=NOT_EXECUTED; DEPLOYMENT=NOT_REQUESTED; PRODUCTION_ACCESS=NONE'
          test "$TYPES" = success && test "$REGRESSIONS" = success && test "$PROBES" = success && test "$BUNDLE" = success
