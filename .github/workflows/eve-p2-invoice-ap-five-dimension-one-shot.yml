name: Eve P2 Invoice AP Five Dimension One Shot

on:
  push:
    branches:
      - feature/universal-evidence-ocr-foundation
    paths:
      - '.github/workflows/eve-p2-invoice-ap-five-dimension-one-shot.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INVOICE_AP_ACCEPTANCE_EVIDENCE_DIR: /tmp/eve-invoice-ap-five-dimension
      EVE_TEST_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/universal-evidence-ocr-foundation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply bounded invoice AP patch
        run: |
          python3 scripts/eve-p2-invoice-ap-apply.py
          python3 scripts/eve-p2-invoice-ap-fix1.py
          python3 scripts/eve-p2-invoice-ap-fix2.py
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Install deterministic fixture dependency
        run: python3 -m pip install --user --quiet 'Pillow==12.3.0'

      - name: Reproduce exact physical invoice fixture
        run: |
          rm -rf "$INVOICE_AP_ACCEPTANCE_EVIDENCE_DIR"
          mkdir -p "$INVOICE_AP_ACCEPTANCE_EVIDENCE_DIR"
          python3 scripts/academy/generate_ocr_curriculum_fixtures.py "$INVOICE_AP_ACCEPTANCE_EVIDENCE_DIR" > "$INVOICE_AP_ACCEPTANCE_EVIDENCE_DIR/generation.txt"
          cat "$INVOICE_AP_ACCEPTANCE_EVIDENCE_DIR/generation.txt"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root=Path(os.environ['INVOICE_AP_ACCEPTANCE_EVIDENCE_DIR'])
          p=root/'invoice.png'
          b=p.read_bytes()
          sha=hashlib.sha256(b).hexdigest()
          assert len(b)==31822, len(b)
          assert sha=='1000426f9989dd8aa2767d57c10248648a770aa05d957d04940fd1463e0cf105', sha
          print('INVOICE_AP_FIXTURE_REPRODUCIBILITY=PASS')
          PY

      - name: Invoice AP deterministic interpretation and control contract
        run: npx tsx server/tests/invoiceApInterpretationEngine.test.ts

      - name: Invoice document classification truth
        run: npx tsx server/tests/documentIntelligenceInvoiceTruth.test.ts

      - name: Existing OCR curriculum disagreement regression
        run: npx tsx server/tests/academyOcrCurriculumRunner.test.ts

      - name: Invoice AP deliverable reverse-lineage truth
        run: npx tsx server/tests/invoiceApDeliverableTruth.test.ts

      - name: Receipt deliverable truth regression
        run: |
          RECEIPT_ACCEPTANCE_EVIDENCE_DIR=/tmp/eve-receipt-regression python3 scripts/academy/generate_ocr_curriculum_fixtures.py /tmp/eve-receipt-regression >/tmp/eve-receipt-regression-generation.txt
          RECEIPT_ACCEPTANCE_EVIDENCE_DIR=/tmp/eve-receipt-regression npx tsx server/tests/receiptDeliverableTruth.test.ts

      - name: Five-dimension curriculum catalog regression
        run: npx tsx server/tests/fiveDimensionAcademyCurriculum.test.ts

      - name: Five-dimension grading regression
        run: npx tsx server/tests/fiveDimensionAcademyGrading.test.ts

      - name: Image source-to-pixel presentation regression
        run: npx tsx server/tests/imageSourceToPixelPresentation.test.ts

      - name: OCR parser evidence regression
        run: npx tsx server/tests/ocrParserEvidence.test.ts

      - name: OCR orientation retry regression
        run: npx tsx server/tests/ocrOrientationRetry.test.ts

      - name: OCR fail-closed quality regression
        run: npx tsx server/tests/ocrFailClosedQualityGate.test.ts

      - name: PDF OCR fallback regression
        run: npx tsx server/tests/pdfOcrFallback.test.ts

      - name: P1-009 sufficiency regression
        run: npx tsx server/tests/taskEvidenceSufficiency.test.ts

      - name: P1-010 clarification coordinator regression
        run: npx tsx server/tests/sufficiencyClarificationCoordinator.test.ts

      - name: P1-010 clarification route/auth regression
        run: timeout 30s npx tsx server/tests/sufficiencyClarificationRoutes.test.ts

      - name: Universal evidence regression
        run: npx tsx server/tests/universalSourceEvidenceContract.test.ts

      - name: Spreadsheet lineage regression
        run: npx tsx server/tests/spreadsheetSourceToPixelLineage.test.ts

      - name: Presentation adapter regression
        run: npx tsx src/adapters/presentationAdapters.test.ts

      - name: Academy dashboard truth regression
        run: npx tsx server/tests/academyDashboardTruthAuditor.test.ts

      - name: Production build
        run: npm run build

      - name: Invoice AP Product Truth in actual built Eve UI
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then echo 'MISSING_BROWSER_EXECUTABLE'; exit 1; fi
          export CHROME_BIN
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/eve-invoice-ap-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          npx tsx server/tests/invoiceApProductTruthBrowser.test.ts
          kill $PREVIEW_PID 2>/dev/null || true
          wait $PREVIEW_PID 2>/dev/null || true
          trap - EXIT

      - name: Compose evidence-backed invoice AP five-dimension result
        run: npx tsx server/tests/invoiceApFiveDimensionAcceptance.test.ts

      - name: Upload bounded invoice AP acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: eve-invoice-ap-five-dimension-acceptance
          path: /tmp/eve-invoice-ap-five-dimension
          retention-days: 7

      - name: Final production build after acceptance gates
        run: npm run build

      - name: Commit tested invoice AP closure and remove one-shot machinery
        run: |
          rm -f scripts/eve-p2-invoice-ap-apply.py scripts/eve-p2-invoice-ap-fix1.py scripts/eve-p2-invoice-ap-fix2.py .github/workflows/eve-p2-invoice-ap-five-dimension-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close invoice AP five-dimension curriculum'
          git push origin HEAD:feature/universal-evidence-ocr-foundation
