name: Studio export preservation and isolated review
on:
  push:
    branches: [fix/frontend-runtime-parity]
    paths: ['.github/workflows/studio-export-reconciliation.yml']
permissions:
  contents: read
concurrency:
  group: studio-export-preservation
  cancel-in-progress: false
jobs:
  preserve:
    if: github.repository == 'aijaraix/Eve-s-Bookkeeping-Intelligence' && github.ref == 'refs/heads/fix/frontend-runtime-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.commit.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify baseline and apply only the preserved source delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          base='0509c73f68a1dfc722529d3e333993bbf137c489'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          expected={
            'server.ts':('25a3a8c0de5e22a9173ccfbe4db4fd9b3555d70d','7b169e0bc4c669ea9a85e052551ca0562d7685bf'),
            'server/cpaOrganization/cpaOrganizationRoutes.ts':('993b69d0f7fc7a7295ce7c88ba355b1cf697d244','ca64e0c633c22279482f3952b7c04182809a26b0'),
            'server/cpaOrganization/universalEngagementModel.ts':('0081226aa6233e1e9256a696fc1731dbec4f5ed6','9462fd5ce22772aa67fb8bab91e26ef279f1b95f'),
            'server/cpaOrganization/eveInternalAuditEngine.ts':('f877e4aa00083e98da3ab613a7d65ea2e422aca3','3a812452ba3f027aa0a1200ae8b288281cffab0c'),
            'server/cpaOrganization/verifiedCustomerContinuationService.ts':('039328924edccb495d2bf7b54079bb7e5f17a667','0a029f59efea5f9876a36f6c6f5c6c5d1cf06931')
          }
          def blob(p):
            b=Path(p).read_bytes()
            return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          for p,(old,new) in expected.items():
            assert blob(p)==old, 'BASE_DRIFT:'+p
          assert blob('Dockerfile')=='7383b66acf906c132126cf28c39b59af04941575'
          assert blob('test_all_defects.ts')=='9c7e219aae5304c33644e81820ba41c7cdbda514'
          patch=Path('.github/reconciliation/studio-source-preservation.patch')
          assert hashlib.sha256(patch.read_bytes()).hexdigest()=='636bf6eb596212c43e6fcf22a73456cf5365faf21a34fcddf31897ba4698cec9'
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==set(expected), 'UNEXPECTED_CHANGED_PATHS'
          for p,(old,new) in expected.items():
            assert blob(p)==new, 'EXPORT_MISMATCH:'+p
          assert subprocess.check_output(['git','rev-parse','HEAD:src'],text=True).strip()=='51b68070eba42f08c47bccbc724bfc0af4e5d01d'
          print('SOURCE_PRESERVATION=EXACT_5_FILES; FRONTEND=UNCHANGED; DOCKERFILE=PRESERVED; ACCEPTANCE=NOT_GRANTED')
          PY
      - name: Commit to repair branch only and remove one-shot bootstrap
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/frontend-runtime-parity
          git fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts server/cpaOrganization/cpaOrganizationRoutes.ts server/cpaOrganization/universalEngagementModel.ts server/cpaOrganization/eveInternalAuditEngine.ts server/cpaOrganization/verifiedCustomerContinuationService.ts
          git rm .github/reconciliation/studio-source-preservation.patch .github/workflows/studio-export-reconciliation.yml
          git commit -m 'wip(frontend): preserve exact Studio source edits for review; not approved for release'
          git push origin "HEAD:refs/heads/$branch"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: preserve
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      NODE_ENV: test
      ACADEMY_AUTONOMOUS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preserve.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --include=dev
      - name: TypeScript validation (independent of transpilation)
        id: types
        continue-on-error: true
        run: npm run lint
      - name: Existing isolated regression command
        id: regressions
        continue-on-error: true
        run: npm test
      - name: Production bundle generation (not runtime acceptance)
        id: bundle
        continue-on-error: true
        run: npm run build
      - name: Truthful combined gate
        if: always()
        env:
          TYPES: ${{ steps.types.outcome }}
          REGRESSIONS: ${{ steps.regressions.outcome }}
          BUNDLE: ${{ steps.bundle.outcome }}
        run: |
          echo "TYPESCRIPT=$TYPES"
          echo "REGRESSIONS=$REGRESSIONS"
          echo "BUNDLE=$BUNDLE"
          echo 'BROWSER_ACCEPTANCE=NOT_EXECUTED; DEPLOYMENT=NOT_REQUESTED; PRODUCTION_DATA_ACCESS=NONE'
          test "$TYPES" = success && test "$REGRESSIONS" = success && test "$BUNDLE" = success
